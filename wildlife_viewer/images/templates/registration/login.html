{% extends "base.html" %}

{% block hero %}
<section class="hero">
    <h1>Login</h1>
    <p>Researcher and administrator access.</p>
</section>
{% endblock %}

{% block content %}
<div class="content-page login-page">

    <section class="content-card login-card">
        <h2>Sign In</h2>

        <form method="post">
            {% csrf_token %}

            {{ form.as_p }}

            <button class="btn-primary" type="submit">Login</button>
        </form>
    </section>

</div>
{% endblock %}
